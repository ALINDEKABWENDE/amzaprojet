{% extends "base.html" %}
{% block title %}Supprimer un produit{% endblock %}
{% block content %}

<div class="card auth-card p-4">
    <div class="text-center mb-3">
        <i class="bi bi-exclamation-triangle" style="font-size:2.5rem; color:#c62828;"></i>
        <h5 class="mt-2">Supprimer « {{ produit.nom }} » ?</h5>
        <p class="text-muted">Cette action est définitive. L'historique des mouvements liés à ce produit sera aussi supprimé.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <a href="{% url 'inventory:produit_modifier' produit.id %}" class="btn btn-outline-secondary flex-grow-1">Annuler</a>
            <button type="submit" class="btn btn-danger flex-grow-1">Supprimer définitivement</button>
        </div>
    </form>
</div>
{% endblock %}
